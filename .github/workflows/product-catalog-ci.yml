name: Product Catalog CI

on:
  push:
    paths:
      - "product-catalog-service/**"
      - ".github/workflows/product-catalog-ci.yml"
  pull_request:
    paths:
      - "product-catalog-service/**"
      - ".github/workflows/product-catalog-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify application and integration tests
        run: mvn --batch-mode --no-transfer-progress -f product-catalog-service/pom.xml verify

      - name: Build application container image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker build --tag product-catalog-service:ci --file product-catalog-service/Dockerfile product-catalog-service; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Docker build failed (attempt $attempt); retrying in 15 seconds..."
            sleep 15
          done


  compose-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the complete observability stack
        run: docker compose -f product-catalog-service/compose.yaml up --build -d

      - name: Verify application, metrics, traces, and profile isolation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f product-catalog-service/compose.yaml ps
              docker compose -f product-catalog-service/compose.yaml logs app postgres redis jaeger
              exit 1
            fi
            sleep 5
          done

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/internal/dev/slow)
          if [ "$status" != "404" ]; then
            echo "Expected the dev-only endpoint to return 404 in the default profile; got $status"
            exit 1
          fi

          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"sku":"OBSERVABILITY-CI-001","name":"Observability Smoke Test","description":"Created by the Compose smoke test","price":19.99}' \
            http://localhost:8080/api/v1/products

          metrics_ok=false
          for attempt in {1..12}; do
            result=$(curl --fail --silent --get \
              --data-urlencode 'query=catalog_product_create_seconds_count' \
              http://localhost:9090/api/v1/query || true)
            if echo "$result" | jq -e '.data.result | length > 0' >/dev/null 2>&1; then
              metrics_ok=true
              break
            fi
            sleep 5
          done
          if [ "$metrics_ok" != "true" ]; then
            echo "Prometheus did not scrape catalog_product_create_seconds_count"
            docker compose -f product-catalog-service/compose.yaml logs prometheus app
            exit 1
          fi

          traces_ok=false
          for attempt in {1..12}; do
            result=$(curl --fail --silent --get \
              --data-urlencode 'service=product-catalog-service' \
              --data-urlencode 'limit=20' \
              http://localhost:16686/api/traces || true)
            if echo "$result" | jq -e '.data | length > 0' >/dev/null 2>&1; then
              traces_ok=true
              break
            fi
            sleep 5
          done
          if [ "$traces_ok" != "true" ]; then
            echo "Jaeger did not receive traces for product-catalog-service"
            docker compose -f product-catalog-service/compose.yaml logs jaeger app
            exit 1
          fi

      - name: Show Compose service status
        if: always()
        run: docker compose -f product-catalog-service/compose.yaml ps

      - name: Stop the observability stack
        if: always()
        run: docker compose -f product-catalog-service/compose.yaml down --volumes
